<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlobAnim Module Test</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    
    .animation-container {
      width: 400px;
      height: 400px;
      border: 1px solid #ccc;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .control-group {
      display: flex;
      flex-direction: column;
      min-width: 150px;
    }
    
    label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    button {
      padding: 8px 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>BlobAnim Module Test</h1>
    
    <div id="animation" class="animation-container"></div>
    
    <div class="controls">
      <div class="control-group">
        <label for="state">State</label>
        <select id="state">
          <option value="chaos">Chaos</option>
          <option value="organizing">Organizing</option>
          <option value="structured">Structured</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="count">Count</label>
        <input type="range" id="count" min="1" max="50" value="10">
        <span id="count-value">10</span>
      </div>
      
      <div class="control-group">
        <label for="size">Size</label>
        <input type="range" id="size" min="5" max="50" value="20">
        <span id="size-value">20</span>
      </div>
      
      <div class="control-group">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1">
        <span id="speed-value">1</span>
      </div>
      
      <div class="control-group">
        <label for="color">Color</label>
        <input type="color" id="color" value="#3b82f6">
      </div>
      
      <div class="control-group">
        <label for="gooey">Gooey Effect</label>
        <input type="checkbox" id="gooey" checked>
      </div>
      
      <div class="control-group">
        <button id="pause">Pause</button>
        <button id="resume" disabled>Resume</button>
      </div>
    </div>
  </div>
  
  <script type="module">
    // Import the createAnim function
    import { createAnim } from './simple-module.js';
    
    // Get elements
    const container = document.getElementById('animation');
    const stateSelect = document.getElementById('state');
    const countInput = document.getElementById('count');
    const countValue = document.getElementById('count-value');
    const sizeInput = document.getElementById('size');
    const sizeValue = document.getElementById('size-value');
    const speedInput = document.getElementById('speed');
    const speedValue = document.getElementById('speed-value');
    const colorInput = document.getElementById('color');
    const gooeyInput = document.getElementById('gooey');
    const pauseButton = document.getElementById('pause');
    const resumeButton = document.getElementById('resume');
    
    // Create animation
    const animation = createAnim(container, {
      count: 10,
      size: 20,
      color: '#3b82f6',
      speed: 1,
      state: 'chaos',
      variant: 'default',
      gooey: true
    });
    
    // Update animation when controls change
    stateSelect.addEventListener('change', updateAnimation);
    
    countInput.addEventListener('input', () => {
      countValue.textContent = countInput.value;
      updateAnimation();
    });
    
    sizeInput.addEventListener('input', () => {
      sizeValue.textContent = sizeInput.value;
      updateAnimation();
    });
    
    speedInput.addEventListener('input', () => {
      speedValue.textContent = speedInput.value;
      updateAnimation();
    });
    
    colorInput.addEventListener('change', updateAnimation);
    gooeyInput.addEventListener('change', updateAnimation);
    
    // Pause/resume buttons
    pauseButton.addEventListener('click', () => {
      animation.pause();
      pauseButton.disabled = true;
      resumeButton.disabled = false;
    });
    
    resumeButton.addEventListener('click', () => {
      animation.resume();
      pauseButton.disabled = false;
      resumeButton.disabled = true;
    });
    
    // Update animation with current control values
    function updateAnimation() {
      animation.update({
        state: stateSelect.value,
        count: parseInt(countInput.value),
        size: parseInt(sizeInput.value),
        speed: parseFloat(speedInput.value),
        color: colorInput.value,
        gooey: gooeyInput.checked
      });
    }
  </script>
</body>
</html>
