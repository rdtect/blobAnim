<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlobAnim Basic Test</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    
    .animation-container {
      width: 400px;
      height: 400px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>BlobAnim Basic Test</h1>
  <div id="animation" class="animation-container"></div>
  
  <script>
    // Simple SVG creation
    const container = document.getElementById('animation');
    const svg = d3.select(container)
      .append('svg')
      .attr('width', 400)
      .attr('height', 400)
      .attr('viewBox', '0 0 400 400')
      .style('border', '1px solid #ccc');
    
    // Create a group for the blobs
    const group = svg.append('g');
    
    // Create some blobs
    const data = Array.from({ length: 10 }, (_, i) => ({
      id: i,
      x: 200 + Math.cos(i / 10 * Math.PI * 2) * 100,
      y: 200 + Math.sin(i / 10 * Math.PI * 2) * 100
    }));
    
    const blobs = group.selectAll('circle')
      .data(data)
      .join('circle')
      .attr('r', 20)
      .attr('fill', '#3b82f6')
      .attr('opacity', 0.8)
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);
    
    // Animate the blobs
    function animate() {
      // Update positions
      data.forEach((d, i) => {
        const time = Date.now() / 1000;
        d.x = 200 + Math.cos(time * 0.5 + i / 10 * Math.PI * 2) * 100;
        d.y = 200 + Math.sin(time * 0.5 + i / 10 * Math.PI * 2) * 100;
      });
      
      // Update blob positions
      blobs
        .attr('cx', d => d.x)
        .attr('cy', d => d.y);
      
      // Request next frame
      requestAnimationFrame(animate);
    }
    
    // Start animation
    animate();
  </script>
</body>
</html>
