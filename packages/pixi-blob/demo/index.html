<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXI Blob Animation Demo</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .canvas-container {
        position: relative;
        width: 800px;
        height: 600px;
        background: #2a2a2a;
        border-radius: 8px;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      .controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 20px;
        border-radius: 8px;
        color: white;
        font-family: Arial, sans-serif;
        z-index: 1;
      }
      .control-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      select,
      input,
      button {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        background: #333;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background: #444;
      }
      .value-display {
        display: inline-block;
        min-width: 30px;
        text-align: right;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .canvas-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #18181b;
      }
      pixi-blob-element {
        display: block;
        width: 100vw;
        height: 100vh;
        min-width: 320px;
        min-height: 240px;
      }
    </style>
    
    <!-- First load Pixi.js -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.0.0/dist/pixi.min.js"></script>
    
    <!-- Import map to resolve bare specifier for pixi.js in ESM build -->
    <script type="importmap">
    {
      "imports": {
        "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.0.0/dist/pixi.mjs"
      }
    }
    </script>
    
    <!-- Use ESM for pixi-blob and main.js -->
    <script type="module">
      import './dist/pixi-blob.js'; // For dev server with root at packages/pixi-blob/demo/
      import './main.js';
    </script>
  </head>
  <body>
    <div class="canvas-container">
      <!-- Web component for blob animation -->
      <pixi-blob-element
        id="pixiblob"
        count="5"
        size="30"
        speed="1"
        variant="spiral"
        state="chaos"
        gooey
        style="width:100%;height:100%;display:block;"
      ></pixi-blob-element>
      <div class="controls">
        <div class="control-group">
          <label for="variant">Variant:</label>
          <select id="variant">
            <option value="spiral">Spiral</option>
            <option value="random">Random</option>
            <option value="circle">Circle</option>
            <option value="brownian">Brownian</option>
          </select>
        </div>
        <div class="control-group">
          <label for="state">State:</label>
          <select id="state">
            <option value="chaos">Chaos</option>
            <option value="structured">Structured</option>
            <option value="organizing">Organizing</option>
          </select>
        </div>
        <div class="control-group">
          <label for="speed"
            >Speed:
            <span class="value-display" id="speedValue">1.0</span></label
          >
          <input
            type="range"
            id="speed"
            min="0.1"
            max="5"
            step="0.1"
            value="1"
          />
        </div>
        <div class="control-group">
          <label for="size"
            >Size: <span class="value-display" id="sizeValue">30</span></label
          >
          <input type="range" id="size" min="5" max="100" step="1" value="30" />
        </div>
        <div class="control-group">
          <label for="count"
            >Count: <span class="value-display" id="countValue">5</span></label
          >
          <input type="range" id="count" min="1" max="25" step="1" value="5" />
        </div>
        <div class="control-group">
          <label>
            <input type="checkbox" id="gooey" checked />
            Gooey Effect
          </label>
        </div>
      </div>
    </div>
  </body>
</html>
